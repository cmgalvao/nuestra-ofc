# Prévia do site no GitHub Pages: https://cmgalvao.github.io/nuestra-ofc/
# Roda a cada envio para o main. A prévia fica fora do Google (noindex) e usa a pasta /nuestra-ofc/.
# O site oficial (agencianuestra.com.br) continua sendo gerado na raiz, sem essas variáveis.
name: Prévia no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Gerar a prévia (inclui a checagem do check-dist)
        run: npm run build
        env:
          BASE_PATH: /nuestra-ofc/
          PREVIEW: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
